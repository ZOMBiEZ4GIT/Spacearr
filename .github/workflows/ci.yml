name: CI
on:
  push: { branches: [main, rebuild] }
  pull_request:
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg mediainfo
      - run: dotnet restore src/Spacearr.Tests
      - run: dotnet build src/Spacearr.Tests --no-restore -c Release -p:SkipWeb=true
      - run: dotnet test src/Spacearr.Tests --no-build -c Release --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: "**/results.trx" }
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with: { global-json-file: global.json }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cd web && npm ci && npm run build
      - run: dotnet build src/Spacearr -c Release -p:SkipWeb=true
      - run: cd web && npx playwright install --with-deps chromium && npm run e2e
        env: { SPACEARR_E2E_REQUIRE_FFMPEG: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: web/test-results }
  image:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/Dockerfile, push: false, platforms: linux/amd64, build-args: VERSION=0.0.0, cache-from: type=gha, cache-to: type=gha,mode=max }
